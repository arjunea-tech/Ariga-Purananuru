<div class="profile-page">
  <!-- Header Bar (Hot Pink Theme) -->
  <header class="page-header pink-theme">
    <div class="header-content">
      <h1 class="page-title">
        <i class="bi bi-person-circle me-2"></i> Profile
      </h1>
      <button class="settings-btn btn border-0 text-white p-0">
        <i class="bi bi-gear-fill fs-5"></i>
      </button>
    </div>
  </header>

  <div class="container-fluid px-3 py-3">
    <!-- User Avatar & Identity Card -->
    <div class="user-card card border-0 shadow-sm p-3 mb-3 text-center">
      <div class="avatar-wrapper mx-auto mb-2">
        <img src="assets/images/logo.png" alt="Avatar" class="avatar-img shadow-sm" />
      </div>
      <h2 class="h5 fw-bold text-dark mb-1">{{ userName() }}</h2>
      <p class="small text-muted mb-2">{{ title() }}</p>
      
      <div class="xp-badge bg-warning-subtle text-warning-emphasis d-inline-flex align-items-center gap-1 mx-auto px-3 py-1 rounded-pill fw-bold small">
        <span>⭐ {{ xpPoints() | number }} XP</span>
      </div>
    </div>

    <!-- Achievements Section -->
    <div class="card border-0 shadow-sm p-3 mb-3">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 class="h6 fw-bold text-dark mb-0">Achievements</h3>
        <a class="small text-primary fw-bold text-decoration-none" style="cursor: pointer;">View All</a>
      </div>

      <div class="achievements-row d-flex align-items-center gap-2 overflow-x-auto pb-1">
        @for (ach of achievements(); track ach.name) {
          <div class="achievement-chip d-flex flex-column align-items-center text-center p-2 rounded-3"
               [style.background-color]="ach.bg + '15'">
            <span class="fs-4 mb-1">{{ ach.icon }}</span>
            <span class="chip-title fw-semibold text-dark">{{ ach.name }}</span>
          </div>
        }
      </div>
    </div>

    <!-- Navigation Options Menu -->
    <div class="card border-0 shadow-sm overflow-hidden mb-4">
      <div class="list-group list-group-flush">
        @for (item of menuItems; track item.title) {
          <button (click)="onMenuClick(item)" class="list-group-item list-group-item-action d-flex align-items-center justify-content-between py-3 px-3 border-bottom-0 border-top-0 cursor-pointer">
            <div class="d-flex align-items-center gap-3">
              <i class="bi fs-5 text-primary" [ngClass]="item.icon"></i>
              <span class="fw-semibold text-dark">{{ item.title }}</span>
            </div>
            <i class="bi bi-chevron-right text-muted small"></i>
          </button>
        }
      </div>
    </div>

    <!-- Logout Button -->
    <button class="btn btn-outline-danger w-100 rounded-pill py-2.5 fw-bold d-flex align-items-center justify-content-center gap-2 mb-4"
            (click)="logout()">
      <i class="bi bi-box-arrow-right"></i>
      <span>Log Out</span>
    </button>
  </div>
</div>
