<div class="seer-container">
  <div class="seer-stage">
    
    <!-- HEADER BAR -->
    <div class="seer-header">
      <div class="header-logo">
        <span class="logo-sub">யாப்பு விளையாட்டு</span>
        <h1 class="logo-title">ஜோடி பொருத்து</h1>
      </div>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div class="screen-play animate-fade">
      <div class="game-mode-box">
        <div class="game-nav-bar">
          <span class="move-counter">நகர்வுகள்: {{ matchMoves() }}</span>
        </div>

        @if (matchWon()) {
          <div class="match-success animate-pop">
            <span class="success-message">🎉 வெற்றி! {{ matchMoves() }} நகர்வுகளில் முடித்தீர்கள்!</span>
            <button class="btn-primary-sm" (click)="setupMatchPairs()">மீண்டும்</button>
          </div>
        }

        <div class="cards-grid">
          @for (card of matchCards(); track card.id; let idx = $index) {
            <button class="card-item"
              [class.flipped]="matchFlipped().includes(idx) || matchMatched().has(card.matchId)"
              [class.matched]="matchMatched().has(card.matchId)"
              [class.incorrect]="matchIncorrect().includes(idx)"
              (click)="handleCardFlip(idx)">
              
              @if (matchFlipped().includes(idx) || matchMatched().has(card.matchId)) {
                @if (card.type === 'name') {
                  <div class="card-face card-name">
                    <span class="fruit-emoji">{{ card.fruit }}</span>
                    <span class="name-text">{{ card.name }}</span>
                  </div>
                } @else {
                  <div class="card-face card-pattern">
                    @for (asai of card.pattern; track $index) {
                      <span class="asai-badge xs" [class.neer]="asai === 'நேர்'" [class.nirai]="asai === 'நிரை'">
                        {{ asai === 'நேர்' ? 'நே' : 'நி' }}
                      </span>
                    }
                  </div>
                }
              } @else {
                <div class="card-face card-back">?</div>
              }
            </button>
          }
        </div>
      </div>
    </div>

  </div>
</div>
