<div class="mobile-home-page">
  <!-- Clean & Professional Top Header -->
  <header class="top-bar">
    <div class="d-flex align-items-center gap-3">
      <div class="avatar-emoji">
        👦🏽
      </div>
      <div>
        <div class="greeting-subtitle">{{ timeGreeting() }},</div>
        <div class="greeting-name">{{ userName() }}!</div>
      </div>
    </div>

    <div class="d-flex align-items-center gap-2">
      <div class="streak-pill shadow-sm">
        <i class="bi bi-fire"></i> {{ streakDays() }}
      </div>
    </div>
  </header>

  <div class="content-wrapper container-fluid px-3 pt-3">

    <!-- Continue Learning Section -->
    @if (activeCourse(); as course) {
      <div class="section-title mb-3 d-flex align-items-center justify-content-between animate-fade-in">
        <h2 class="mb-0">தொடர்ந்து படிக்க</h2>
      </div>

      <!-- Professional Course Card -->
      <div class="continue-learning-card p-4 mb-4 animate-slide-up-1" (click)="startNextLesson()">
        <div class="carousel-slide" [ngClass]="carouselAnimation()">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <span class="course-badge">பயிற்சியில் உள்ளது</span>
          </div>

          <h3 class="course-title mb-3">{{ course.title }}</h3>

          <div class="d-flex justify-content-between align-items-end">
            <div class="flex-grow-1 me-3">
              <div class="d-flex justify-content-between mb-2">
                <span class="small fw-bold text-secondary">Progress</span>
                <span class="small fw-bold text-success">{{ course.progress }}%</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill" [style.width.%]="course.progress"></div>
              </div>
            </div>

            <button class="btn btn-play shadow-sm d-flex align-items-center gap-2">
              தொடர்க <i class="bi bi-play-fill fs-5"></i>
            </button>
          </div>
        </div>
      </div>
    }

    <!-- Quick Access Section -->
    <div class="section-title mb-3 animate-slide-up-2">
      <h2 class="mb-0">விரைவு பயிற்சிகள்</h2>
    </div>

    <!-- Professional Grid System -->
    <div class="quick-access-grid mb-5 pb-4 animate-slide-up-2">

      <div class="grid-card cursor-pointer" (click)="openCourse(assignedCourses()[0])">
        <div class="grid-icon-wrapper icon-blue">
          <i class="bi bi-book"></i>
        </div>
        <h3 class="grid-title">பாடங்கள்</h3>
        <span class="grid-subtitle">Courses</span>
      </div>

      <div class="grid-card cursor-pointer" (click)="startQuickQuiz()">
        <div class="grid-icon-wrapper icon-amber">
          <i class="bi bi-controller"></i>
        </div>
        <h3 class="grid-title">பயிற்சிகள்</h3>
        <span class="grid-subtitle">Practice Hub</span>
      </div>

      <div class="grid-card cursor-pointer" (click)="openLeaderboard()">
        <div class="grid-icon-wrapper icon-purple">
          <i class="bi bi-trophy"></i>
        </div>
        <h3 class="grid-title">லீடர்போர்டு</h3>
        <span class="grid-subtitle">Rankings</span>
      </div>

      <div class="grid-card cursor-pointer">
        <div class="grid-icon-wrapper icon-emerald">
          <i class="bi bi-star"></i>
        </div>
        <h3 class="grid-title">சாதனைகள்</h3>
        <span class="grid-subtitle">Achievements</span>
      </div>

    </div>

  </div>
</div>
