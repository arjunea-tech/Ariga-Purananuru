<div class="welcome-container d-flex flex-column align-items-center justify-content-between p-4 position-relative overflow-hidden">
  
  <!-- Floating background elements (optional) -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  
  <div class="text-center mt-5 position-relative z-1">
    <h1 class="welcome-title text-white fw-extrabold mb-1">Learn</h1>
    <h1 class="welcome-title fw-extrabold text-warning">With Fun!</h1>
  </div>

  <div class="hero-image-wrapper flex-grow-1 d-flex align-items-center justify-content-center position-relative z-1 w-100 mt-4 mb-4">
    <!-- Image is now the full background -->
  </div>

  <div class="w-100 position-relative z-1 mb-3">
    <button class="btn btn-primary w-100 rounded-pill py-3 fw-bold fs-5 shadow-lg welcome-btn" (click)="startLearning()">
      Start Learning
    </button>
  </div>
  
</div>
