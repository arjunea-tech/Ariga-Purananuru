<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>அழகுத் தமிழ் யாப்பு</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Tamil', Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .quiz-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            margin-top: 30px;
        }
        .quiz-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .quiz-word {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
        }
        .asai-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }
        .asai-item {
            background-color: #f8f9fa;
            padding: 8px 12px;
            border-radius: 5px;
            margin: 5px;
            text-align: center;
        }
        .asai-text {
            font-weight: bold;
        }
        .asai-type {
            font-size: 0.8rem;
            color: #6c757d;
        }
        .choice-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            background-color: white;
            transition: all 0.2s;
        }
        .choice-btn:hover {
            background-color: #f8f9fa;
        }
        .choice-btn.selected {
            background-color: #cfe2ff;
            border-color: #b6d4fe;
        }
        .choice-btn.correct {
            background-color: #d1e7dd;
            border-color: #badbcc;
        }
        .choice-btn.incorrect {
            background-color: #f8d7da;
            border-color: #f5c2c7;
        }
        .feedback {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .correct-feedback {
            background-color: #d1e7dd;
            color: #0f5132;
        }
        .incorrect-feedback {
            background-color: #f8d7da;
            color: #842029;
        }
        .progress-indicator {
            text-align: center;
            margin-bottom: 15px;
        }
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .result-screen {
            text-align: center;
            display: none;
        }
        .result-score {
            font-size: 2rem;
            font-weight: bold;
            margin: 20px 0;
        }
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }
        .debug-panel {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
        }
        .seer-category {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            margin: 15px 0 10px;
            color: #495057;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="quiz-container">
            <!-- Quiz Header -->
            <div class="quiz-header">
                <h1>அழகுத் தமிழ் யாப்பு</h1>
            </div>
            
            <!-- Loading Spinner -->
            <div id="loadingSpinner" class="loading-spinner">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="ms-2 mb-0">கேள்விகள் ஏற்றப்படுகின்றன...</p>
            </div>
            
            <!-- Quiz Content -->
            <div id="quizContent" style="display: none;">
                <div class="progress-indicator">
                    <span id="currentQuestion">1</span>/<span id="totalQuestions">5</span>
                </div>
                
                <div class="quiz-instructions">
                    <p>சொல்லின் அசைகளுக்குப் பொருத்தமான சீர் வகையை தேர்ந்தெடுக்கவும்:</p>
                </div>
                
                <div class="quiz-word" id="quizWord"></div>
                
                <div class="asai-container" id="asaiContainer"></div>
                
                <div id="seerCategory" class="seer-category"></div>
                
                <div class="choices-container" id="choicesContainer"></div>
                
                <div id="feedback" class="feedback" style="display: none;"></div>
                
                <div class="navigation">
                    <button id="prevBtn" class="btn btn-secondary" disabled>முந்தைய கேள்வி</button>
                    <button id="nextBtn" class="btn btn-primary" disabled>அடுத்த கேள்வி</button>
                </div>
            </div>
            
            <!-- Results Screen -->
            <div id="resultScreen" class="result-screen">
                <h2>உங்கள் முடிவுகள்</h2>
                <div class="result-score">
                    <span id="scoreDisplay">0</span>/<span id="totalQuestionsResult">5</span>
                </div>
                <div id="resultFeedback" class="mb-4"></div>
                <button id="restartBtn" class="btn btn-primary">மீண்டும் முயற்சி செய்</button>
            </div>
        </div>
    </div>
    
    <!-- Debug Panel - Will be visible only in development -->
    <div class="debug-panel">
        <div>Status: <span id="statusIndicator">Loading...</span></div>
        <div>API: <span id="apiStatus">Checking...</span></div>
    </div>

    <!-- JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Debug helpers
            const statusIndicator = document.getElementById('statusIndicator');
            const apiStatus = document.getElementById('apiStatus');
            
            // Quiz elements
            const loadingSpinner = document.getElementById('loadingSpinner');
            const quizContent = document.getElementById('quizContent');
            const resultScreen = document.getElementById('resultScreen');
            const quizWord = document.getElementById('quizWord');
            const asaiContainer = document.getElementById('asaiContainer');
            const seerCategory = document.getElementById('seerCategory');
            const choicesContainer = document.getElementById('choicesContainer');
            const feedback = document.getElementById('feedback');
            const currentQuestionSpan = document.getElementById('currentQuestion');
            const totalQuestionsSpan = document.getElementById('totalQuestions');
            const totalQuestionsResult = document.getElementById('totalQuestionsResult');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const resultFeedback = document.getElementById('resultFeedback');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const restartBtn = document.getElementById('restartBtn');
            
            // Quiz state
            let questions = [];
            let currentQuestionIndex = 0;
            let userAnswers = {};
            let score = 0;
            let answeredQuestions = 0;
            
            // Initialize quiz
            function initQuiz() {
                statusIndicator.textContent = 'Initializing...';
                loadingSpinner.style.display = 'flex';
                quizContent.style.display = 'none';
                resultScreen.style.display = 'none';
                
                // Reset state
                questions = [];
                currentQuestionIndex = 0;
                userAnswers = {};
                score = 0;
                answeredQuestions = 0;
                
                // Fetch questions
                fetchQuestions();
            }
            
            // Fetch questions from API
            function fetchQuestions() {
                statusIndicator.textContent = 'Fetching questions...';
                apiStatus.textContent = 'Requesting...';
                
                fetch('/get_questions?num=5')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! Status: ${response.status}`);
                        }
                        apiStatus.textContent = 'Response received';
                        return response.json();
                    })
                    .then(data => {
                        questions = data;
                        apiStatus.textContent = 'Success';
                        statusIndicator.textContent = 'Questions loaded';
                        
                        // Update UI
                        totalQuestionsSpan.textContent = questions.length;
                        totalQuestionsResult.textContent = questions.length;
                        
                        // Show quiz
                        loadingSpinner.style.display = 'none';
                        quizContent.style.display = 'block';
                        
                        // Display first question
                        displayQuestion(0);
                    })
                    .catch(error => {
                        console.error('Error fetching questions:', error);
                        apiStatus.textContent = 'Error: ' + error.message;
                        statusIndicator.textContent = 'Failed to load questions';
                        
                        // Show error in loading spinner area
                        loadingSpinner.innerHTML = `
                            <div class="alert alert-danger">
                                <h4>ஏற்றுவதில் பிழை</h4>
                                <p>கேள்விகளை ஏற்றுவதில் பிழை ஏற்பட்டது. மீண்டும் முயற்சிக்கவும்.</p>
                                <button class="btn btn-primary" onclick="location.reload()">மீண்டும் முயற்சி</button>
                            </div>
                        `;
                    });
            }
            
            // Display a question
            function displayQuestion(index) {
                if (!questions || questions.length === 0) {
                    statusIndicator.textContent = 'No questions available';
                    return;
                }
                
                const question = questions[index];
                statusIndicator.textContent = `Showing question ${index + 1}`;
                
                // Update current question number
                currentQuestionIndex = index;
                currentQuestionSpan.textContent = index + 1;
                
                // Display word
                quizWord.textContent = question.word;
                
                // Display asai groups
                asaiContainer.innerHTML = '';
                question.asai_groups.forEach(asai => {
                    const asaiElement = document.createElement('div');
                    asaiElement.className = 'asai-item';
                    asaiElement.innerHTML = `
                        <div class="asai-text">${asai.syllable}</div>
                        <div class="asai-type">${asai.type}</div>
                    `;
                    asaiContainer.appendChild(asaiElement);
                });
                
                // Display seer category based on the category from backend
                seerCategory.textContent = question.category || '';
                
                // Display choices
                choicesContainer.innerHTML = '';
                question.choices.forEach(choice => {
                    const button = document.createElement('button');
                    button.className = 'choice-btn';
                    button.textContent = choice;
                    
                    // Add classes if already answered
                    if (userAnswers[question.id]) {
                        if (userAnswers[question.id] === choice) {
                            button.classList.add('selected');
                            
                            if (choice === question.correct_answer) {
                                button.classList.add('correct');
                            } else {
                                button.classList.add('incorrect');
                            }
                        } else if (choice === question.correct_answer) {
                            button.classList.add('correct');
                        }
                        
                        // Disable button if question already answered
                        button.disabled = true;
                    }
                    
                    // Add click event
                    button.addEventListener('click', function() {
                        selectAnswer(question.id, choice, question.correct_answer);
                    });
                    
                    choicesContainer.appendChild(button);
                });
                
                // Show/hide feedback
                feedback.style.display = userAnswers[question.id] ? 'block' : 'none';
                if (userAnswers[question.id]) {
                    const isCorrect = userAnswers[question.id] === question.correct_answer;
                    feedback.className = isCorrect ? 
                        'feedback correct-feedback' : 'feedback incorrect-feedback';
                    feedback.textContent = isCorrect ? 
                        'சரியான பதில்!' : 
                        `தவறான பதில். சரியான பதில்: ${question.correct_answer}`;
                }
                
                // Update navigation buttons
                prevBtn.disabled = index === 0;
                nextBtn.disabled = index === questions.length - 1 && !userAnswers[question.id];
                nextBtn.textContent = index === questions.length - 1 ? 'முடிவுகளைக் காட்டு' : 'அடுத்த கேள்வி';
            }
            
            // Select an answer
            function selectAnswer(questionId, selectedAnswer, correctAnswer) {
                statusIndicator.textContent = 'Checking answer...';
                
                // If already answered, ignore
                if (userAnswers[questionId]) {
                    return;
                }
                
                // Call API to check answer
                fetch('/check_answer', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question_id: questionId,
                        selected_answer: selectedAnswer,
                        correct_answer: correctAnswer
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // Store user answer
                    userAnswers[questionId] = selectedAnswer;
                    answeredQuestions++;
                    
                    // Update score
                    if (data.correct) {
                        score++;
                    }
                    
                    // Refresh question display
                    displayQuestion(currentQuestionIndex);
                    
                    // Enable next button
                    nextBtn.disabled = false;
                    
                    // Auto-advance after a delay if not the last question
                    if (currentQuestionIndex < questions.length - 1) {
                        setTimeout(() => {
                            if (currentQuestionIndex < questions.length - 1) {
                                displayQuestion(currentQuestionIndex + 1);
                            }
                        }, 1500);
                    }
                    
                    // Show results if all questions answered
                    if (answeredQuestions === questions.length) {
                        setTimeout(() => {
                            showResults();
                        }, 1000);
                    }
                })
                .catch(error => {
                    console.error('Error checking answer:', error);
                    apiStatus.textContent = 'Error checking answer: ' + error.message;
                    
                    // Fallback behavior (assume correct for UX purposes)
                    userAnswers[questionId] = selectedAnswer;
                    answeredQuestions++;
                    if (selectedAnswer === correctAnswer) {
                        score++;
                    }
                    displayQuestion(currentQuestionIndex);
                    nextBtn.disabled = false;
                });
            }
            
            // Show results
            function showResults() {
                quizContent.style.display = 'none';
                resultScreen.style.display = 'block';
                
                scoreDisplay.textContent = score;
                
                // Generate feedback based on score
                const percentage = (score / questions.length) * 100;
                let feedbackMessage = '';
                
                if (percentage >= 90) {
                    feedbackMessage = 'அருமை! நீங்கள் தமிழ் யாப்பில் சிறந்த அறிவு கொண்டுள்ளீர்கள்!';
                } else if (percentage >= 70) {
                    feedbackMessage = 'நன்று! நீங்கள் தமிழ் யாப்பை நன்கு புரிந்துகொண்டுள்ளீர்கள்.';
                } else if (percentage >= 50) {
                    feedbackMessage = 'நல்ல முயற்சி! மேலும் பயிற்சி செய்வது நல்லது.';
                } else {
                    feedbackMessage = 'தொடர்ந்து பயிற்சி செய்யுங்கள். தமிழ் யாப்பு ஆழமான கலை!';
                }
                
                resultFeedback.textContent = feedbackMessage;
            }
            
            // Event listeners
            prevBtn.addEventListener('click', function() {
                if (currentQuestionIndex > 0) {
                    displayQuestion(currentQuestionIndex - 1);
                }
            });
            
            nextBtn.addEventListener('click', function() {
                if (currentQuestionIndex < questions.length - 1) {
                    displayQuestion(currentQuestionIndex + 1);
                } else {
                    showResults();
                }
            });
            
            restartBtn.addEventListener('click', function() {
                initQuiz();
            });
            
            // Start the quiz
            initQuiz();
        });
    </script>
</body>
</html>
