<div class="seer-container">
  <div class="seer-stage">
    
    <!-- HEADER BAR -->
    <div class="seer-header">
      <div class="header-logo">
        <span class="logo-sub">யாப்பு விளையாட்டு</span>
        <h1 class="logo-title">வடிவம் ➔ பெயர்</h1>
      </div>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div class="screen-play animate-fade">
      <div class="game-mode-box">
        <div class="game-nav-bar">
          @if (streak() >= 3) {
            <span class="streak-badge">🔥 {{ streak() }} தொடர்!</span>
          }
        </div>

        <!-- Score progress bar -->
        <div class="score-progress-bar">
          <div class="bar-bg">
            <div class="bar-fill" [style.width.%]="total() > 0 ? (score() / total() * 100) : 0"></div>
          </div>
          <span class="score-text">{{ score() }}/{{ total() }}</span>
        </div>

        <p class="hint-text">இந்த வடிவம் எந்தச் சீர்?</p>

        @if (question(); as q) {
          <!-- Pattern display -->
          <div class="pattern-display-area animate-pop">
            @for (asai of q.pattern; track $index) {
              <span class="asai-badge" [class.neer]="asai === 'நேர்'" [class.nirai]="asai === 'நிரை'">
                {{ asai === 'நேர்' ? 'நே' : 'நி' }}
              </span>
            }
          </div>

          <!-- Options -->
          <div class="options-grid">
            @for (opt of options(); track opt.name) {
              <button class="opt-btn" 
                [class.correct]="selectedAnswer() && opt.name === q.name"
                [class.wrong]="selectedAnswer() === opt.name && opt.name !== q.name"
                (click)="handleAnswer(opt)">
                <span class="opt-label">{{ opt.fruit }} {{ opt.name }}</span>
                @if (selectedAnswer() && opt.name === q.name) {
                  <span class="mnemonic-lbl">{{ opt.mnemonic }}</span>
                }
              </button>
            }
          </div>
        }
      </div>
    </div>

  </div>
</div>
