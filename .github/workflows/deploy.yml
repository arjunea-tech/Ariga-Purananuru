name: Deploy Laravel Backend to Production

on:
  push:
    branches:
      - main
    # Uncomment the below lines if you only want to deploy when backend files change
    # paths:
    #   - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "Starting deployment..."
            
            # Go to the project directory
            cd /var/www/Ariga-Purananuru
            
            # Pull the latest changes from git
            git pull origin main
            
            # Navigate to the backend directory
            cd backend
            
            # Install/update PHP dependencies
            composer install --optimize-autoloader --no-dev
            
            # Run database migrations
            php artisan migrate --force
            
            # Clear and optimize caches
            php artisan config:clear
            php artisan cache:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Ensure correct permissions
            sudo chown -R www-data:www-data /var/www/Ariga-Purananuru/backend
            sudo chmod -R 775 /var/www/Ariga-Purananuru/backend/storage
            sudo chmod -R 775 /var/www/Ariga-Purananuru/backend/bootstrap/cache
            
            echo "Deployment successful!"
